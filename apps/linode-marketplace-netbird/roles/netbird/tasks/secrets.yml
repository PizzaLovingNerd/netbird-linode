---
- name: Inspect the relay authentication secret
  ansible.builtin.stat:
    path: "{{ netbird_project_dir }}/.relay_auth_secret"
  register: netbird_relay_secret_file

- name: Generate the relay authentication secret
  ansible.builtin.command:
    argv:
      - openssl
      - rand
      - -base64
      - "32"
  register: netbird_generated_relay_secret
  changed_when: true
  no_log: true
  when: not netbird_relay_secret_file.stat.exists

- name: Store the relay authentication secret
  ansible.builtin.copy:
    dest: "{{ netbird_project_dir }}/.relay_auth_secret"
    content: "{{ netbird_generated_relay_secret.stdout }}\n"
    owner: root
    group: root
    mode: "0600"
    force: false
  no_log: true
  when: not netbird_relay_secret_file.stat.exists

- name: Inspect the datastore encryption key
  ansible.builtin.stat:
    path: "{{ netbird_project_dir }}/.datastore_encryption_key"
  register: netbird_datastore_key_file

- name: Generate the datastore encryption key
  ansible.builtin.command:
    argv:
      - openssl
      - rand
      - -base64
      - "32"
  register: netbird_generated_datastore_key
  changed_when: true
  no_log: true
  when: not netbird_datastore_key_file.stat.exists

- name: Store the datastore encryption key
  ansible.builtin.copy:
    dest: "{{ netbird_project_dir }}/.datastore_encryption_key"
    content: "{{ netbird_generated_datastore_key.stdout }}\n"
    owner: root
    group: root
    mode: "0600"
    force: false
  no_log: true
  when: not netbird_datastore_key_file.stat.exists

- name: Read the relay authentication secret
  ansible.builtin.slurp:
    path: "{{ netbird_project_dir }}/.relay_auth_secret"
  register: netbird_relay_secret_raw
  no_log: true

- name: Read the datastore encryption key
  ansible.builtin.slurp:
    path: "{{ netbird_project_dir }}/.datastore_encryption_key"
  register: netbird_datastore_key_raw
  no_log: true

- name: Set the NetBird secret facts
  ansible.builtin.set_fact:
    netbird_relay_auth_secret: "{{ netbird_relay_secret_raw.content | b64decode | trim }}"
    netbird_datastore_encryption_key: "{{ netbird_datastore_key_raw.content | b64decode | trim }}"
  no_log: true
