---
- name: Select the Docker package architecture
  ansible.builtin.set_fact:
    common_docker_apt_arch: >-
      {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}

- name: Set the system hostname
  ansible.builtin.hostname:
    name: "{{ netbird_fqdn }}"

- name: Update the apt package index
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed system packages
  ansible.builtin.apt:
    upgrade: full

- name: Check whether the system requires a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: common_reboot_required

- name: Install host security and repository dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - dnsutils
      - fail2ban
      - gnupg
      - iptables
      - openssh-client
      - openssl
      - python3-debian
      - unattended-upgrades
      - ufw
    state: present

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker's apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  register: common_docker_signing_key
  retries: 3
  delay: 5
  until: common_docker_signing_key is succeeded

- name: Configure Docker's stable apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ common_docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts.distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Keep the limited administrator out of the Docker group
  ansible.builtin.user:
    name: "{{ username }}"
    groups:
      - sudo
    append: false

- name: Verify Docker Engine
  ansible.builtin.command: docker info
  changed_when: false

- name: Verify Docker Compose
  ansible.builtin.command: docker compose version
  changed_when: false
