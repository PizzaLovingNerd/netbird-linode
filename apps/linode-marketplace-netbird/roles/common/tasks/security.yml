---
- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTP for the Let's Encrypt redirect and challenge
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow NetBird HTTPS and gRPC traffic
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Allow NetBird STUN traffic
  community.general.ufw:
    rule: allow
    port: "{{ netbird_stun_port | string }}"
    proto: udp

- name: Set the default incoming firewall policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set the default outgoing firewall policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Install the NetBird Docker firewall script
  ansible.builtin.template:
    src: netbird-docker-firewall.sh.j2
    dest: /usr/local/sbin/netbird-docker-firewall
    owner: root
    group: root
    mode: "0750"
  notify: Reload NetBird Docker firewall

- name: Install the NetBird Docker firewall service
  ansible.builtin.template:
    src: netbird-docker-firewall.service.j2
    dest: /etc/systemd/system/netbird-docker-firewall.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload NetBird Docker firewall

- name: Enable the NetBird Docker firewall service
  ansible.builtin.systemd_service:
    name: netbird-docker-firewall
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending Docker firewall changes
  ansible.builtin.meta: flush_handlers

- name: Enable the Fail2ban SSH jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      backend = systemd
      port = ssh
      maxretry = 5
      findtime = 10m
      bantime = 10m

- name: Enable and restart Fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: restarted

- name: Inspect the limited user's authorized keys
  ansible.builtin.stat:
    path: "/home/{{ username }}/.ssh/authorized_keys"
  register: common_limited_authorized_keys

- name: Validate the limited user's authorized keys
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -l
      - -f
      - "/home/{{ username }}/.ssh/authorized_keys"
  register: common_limited_authorized_keys_validation
  changed_when: false
  failed_when: false
  when:
    - common_limited_authorized_keys.stat.exists
    - common_limited_authorized_keys.stat.size | int > 0

- name: Select the SSH password policy
  ansible.builtin.set_fact:
    common_password_authentication: >-
      {{ not (
        common_limited_authorized_keys.stat.exists
        and common_limited_authorized_keys.stat.size | int > 0
        and common_limited_authorized_keys_validation.rc | default(1) == 0
      ) }}

- name: Configure SSH access policy
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-netbird-marketplace.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the NetBird Linode Marketplace app.
      {% if disable_root %}
      PermitRootLogin no
      {% endif %}
      PubkeyAuthentication yes
      PasswordAuthentication {{ 'yes' if common_password_authentication else 'no' }}
  notify: Reload SSH
